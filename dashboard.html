<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHOES 개발 퀘스트 · v2.22</title><style>body{background:#111318;color:#eee;font:15px system-ui,sans-serif;max-width:760px;margin:auto;padding:22px 16px 70px}h1{color:#e7c476}a{color:#8ecfff}section{background:#1d2028;border:1px solid #444;border-radius:12px;padding:14px 18px;margin:14px 0}label{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #30333c;align-items:center}input{width:19px;height:19px;accent-color:#e2bd6b}small{color:#aaa}.bar{height:13px;border-radius:20px;background:#343741;overflow:hidden}.fill{height:100%;background:#69b98a;width:0}button{background:#343b47;border:1px solid #666;border-radius:6px;color:#eee;padding:8px 12px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}#count{font-size:24px;color:#e7c476}</style></head><body><header><div><h1>ECHOES · 개발 퀘스트</h1><small>v2.22 · 체크는 이 브라우저에 저장됩니다</small></div><a href="index.html">게임으로 ↗</a></header><p id="count"></p><div class="bar"><div class="fill" id="fill"></div></div><p><small>완료 항목만 집계합니다. ‘검증 중’은 기본적으로 미완료입니다. 다른 기기와 자동 동기화되지는 않습니다.</small></p><main id="chapters"></main><button onclick="if(confirm('체크를 기본 상태로 되돌릴까요?')){localStorage.removeItem('echoes_quest_progress_v1');render()}">체크 초기화</button><script>
const chapters=[["1. 플레이 가능한 게임", [["주사위·족보 전투", "done"], ["장비·상점·몬스터 특성", "done"], ["15스테이지와 승리·패배 엔딩", "done"], ["저장·이어하기·타이틀 복귀", "test"], ["전체 플레이 오류 검증", "todo"]]], ["2. 전략과 밸런스", [["유니크 장비·도감", "test"], ["장비 강화·족보 성장", "test"], ["리롤 비용·회복 제한", "test"], ["15스테이지 난이도 조정", "todo"], ["다양한 빌드의 재미 검증", "todo"]]], ["3. 그래픽과 사용성", [["기본 픽셀 캐릭터·전투 화면", "done"], ["피해 숫자·타격 연출", "test"], ["장비 비교·상태 정보", "test"], ["장비 아이콘 이미지", "todo"], ["정교한 캐릭터·배경 아트", "todo"], ["공격·피격 애니메이션 고도화", "todo"]]], ["4. 외부 테스트와 출시", [["GitHub Pages 테스트 배포", "done"], ["지인 플레이테스트·피드백", "todo"], ["치명적 버그 수정·안정화", "todo"], ["출시 플랫폼·가격 결정", "todo"], ["스토어 등록·정식 출시", "todo"]]], ["5. 출시 이후", [["이용자 피드백 분석", "todo"], ["판매·수익 지표 확인", "todo"], ["업데이트 및 신규 콘텐츠", "todo"]]]];const key='echoes_quest_progress_v1';function render(){let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};let n=0,total=0;document.getElementById('chapters').innerHTML='';chapters.forEach(([title,items])=>{const section=document.createElement('section');const h=document.createElement('h2');h.textContent=title;section.appendChild(h);items.forEach(([name,status])=>{total++;const checked=Object.hasOwn(saved,name)?saved[name]:status==='done';if(checked)n++;const label=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=checked;cb.addEventListener('change',()=>{saved[name]=cb.checked;localStorage.setItem(key,JSON.stringify(saved));render()});const span=document.createElement('span');span.textContent=name+(status==='test'?' · 검증 중':'');label.append(cb,span);section.appendChild(label)});document.getElementById('chapters').appendChild(section)});document.getElementById('count').textContent=`${n} / ${total} 완료 · ${Math.round(n/total*100)}%`;document.getElementById('fill').style.width=(n/total*100)+'%'}render();</script></body></html>
