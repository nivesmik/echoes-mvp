<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHOES v2.23 테스트 리포트</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e1018;color:#e9e9ec;font-family:system-ui,'Noto Sans KR',sans-serif;padding:20px;line-height:1.5}main{max-width:850px;margin:auto}h1{color:#f0cb70;font-size:1.5rem}.sub{color:#b9b9c7}.bar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}button,a.btn{border:1px solid #b99548;background:#292318;color:#f7d98c;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer;text-decoration:none}.summary{background:#1b2030;border:1px solid #424b62;padding:15px;border-radius:10px;margin:14px 0}.case{border-left:4px solid #5a6070;background:#1a1d26;margin:7px 0;padding:9px 12px;border-radius:5px}.pass{border-left-color:#40d98c}.fail{border-left-color:#ff6979}.warn{border-left-color:#e9c266}.pass strong{color:#62e7a0}.fail strong{color:#ff8791}.warn strong{color:#e9c266}pre{background:#090b10;border:1px solid #343d50;color:#bfe0d2;padding:14px;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:340px;overflow:auto}#test-frame{position:absolute;left:-99999px;top:0;width:900px;height:800px;pointer-events:none}.notice{color:#e9c266;font-size:.9rem}</style></head><body><main><h1>🧪 ECHOES v2.26 자동 테스트</h1><p class="sub">보스까지 직접 플레이하지 않고 보상 → 상점 전환을 재현합니다. 결과는 아래에 초록색/빨간색으로 표시됩니다.</p><div class="bar"><button id="run">▶ 테스트 다시 실행</button><button id="copy">📋 로그 복사</button><a class="btn" href="index.html">게임으로 돌아가기</a></div><div class="summary" id="summary">검사 준비 중…</div><div id="cases"></div><h2>오류 공유용 로그</h2><pre id="log">검사 준비 중…</pre><p class="notice">테스트는 별도 가상 게임 화면에서 실행되며 기존 플레이 기록을 사용하지 않도록 저장소를 분리합니다. 통과는 해당 검사의 성공을 뜻하며, 실제 전체 플레이의 무결성을 보장하지는 않습니다.</p><iframe id="test-frame" sandbox="allow-scripts allow-same-origin" title="분리된 테스트용 게임"></iframe></main><script>
const $=id=>document.getElementById(id);let entries=[],errors=[],runId=0;
function add(name,passed,detail='',status=''){entries.push({name,passed,detail,status:status||(passed?'PASS':'FAIL')});render()}
function render(){let passed=entries.filter(e=>e.status==='PASS').length,failed=entries.filter(e=>e.status==='FAIL').length; $('summary').textContent=`검사 ${entries.length}개 · 성공 ${passed}개 · 실패 ${failed}개`;$('cases').replaceChildren();for(let e of entries){let div=document.createElement('div');div.className='case '+(e.status==='PASS'?'pass':e.status==='FAIL'?'fail':'warn');let strong=document.createElement('strong');strong.textContent=`${e.status==='PASS'?'🟢':e.status==='FAIL'?'🔴':'🟡'} ${e.name} — ${e.status}`;div.append(strong);if(e.detail){let sub=document.createElement('div');sub.textContent=e.detail;div.append(sub)}$('cases').append(div)}$('log').textContent=[`ECHOES v2.26 | ${new Date().toLocaleString('ko-KR')}`,`환경: ${navigator.userAgent}`,`성공 ${passed} / 실패 ${failed}`,...entries.map(e=>`[${e.status}] ${e.name}${e.detail?' | '+e.detail:''}`),...errors.map(e=>'[ERROR] '+e)].join('\n')}
function assert(name,fn){try{let r=fn();add(name,!!r,r?'':'조건이 충족되지 않았습니다')}catch(e){add(name,false,String(e));errors.push(String(e))}}
async function run(){const current=++runId;entries=[];errors=[];render();$('summary').textContent='게임 코드 불러오는 중…';let html;try{const response=await fetch('index.html?test='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);html=await response.text();if(!html.includes('function finishRewardAndOpenShop'))throw Error('게임 코드에서 전리품 전환 함수를 찾지 못했습니다.')}catch(e){add('게임 파일 불러오기',false,String(e));return}
// Use a per-test in-memory localStorage, before the game's own scripts run.
const mock=`<script>const __memory={};Object.defineProperty(window,'localStorage',{configurable:true,value:{getItem:k=>Object.prototype.hasOwnProperty.call(__memory,k)?__memory[k]:null,setItem:(k,v)=>{__memory[k]=String(v)},removeItem:k=>{delete __memory[k]},clear:()=>{for(const k in __memory)delete __memory[k]}}});window.addEventListener('error',e=>{parent.postMessage({echoesTestError:String(e.message)},'*')});<\/script>`;
html=html.replace(/<head([^>]*)>/i,match=>match+mock);
const frame=$('test-frame');frame.onload=()=>{if(current!==runId)return;setTimeout(()=>{if(current!==runId)return;const w=frame.contentWindow,d=w.document;try{
assert('게임 버전',()=>d.title.includes('v2.26'));
assert('족보 8종',()=>w.eval('POKER_HANDS').length===8);
assert('보스 스테이지 5·10·15',()=>[5,10,15].every(n=>w.eval('BOSS_DB').some(b=>b.id==='b'+n)));
assert('장비 8칸',()=>d.querySelectorAll('.equip-slot').length===8);
assert('상점·보상 창 존재',()=>['shop-modal','trophy-modal','boss-reward-modal'].every(id=>!!d.getElementById(id)));
assert('몬스터 공격/예상 피해 줄 분리',()=>{w.setupStage();w.updateUI();const el=d.getElementById('enemy-intent');return el.querySelectorAll('.enemy-damage-line').length===2});
for(let [name,id] of [['일반 전리품 획득 후 상점 진입','trophy-modal'],['일반 전리품 버리기 후 상점 진입','trophy-modal'],['보스 전리품 획득 후 상점 진입','boss-reward-modal']]){
try{w.setupStage();w.playerGold=0;w.currentStage=id==='boss-reward-modal'?5:1;d.getElementById('shop-modal').classList.remove('active');d.getElementById(id).classList.add('active');w.finishRewardAndOpenShop(id);const opened=d.getElementById('shop-modal').classList.contains('active'),closed=!d.getElementById(id).classList.contains('active');add(name,opened&&closed,`상점 열림=${opened}, 보상창 닫힘=${closed}`);d.getElementById('shop-modal').classList.remove('active')}catch(e){add(name,false,String(e));errors.push(String(e))}}
assert('전투 패널 2:6:2',()=>{const l=d.getElementById('combat-layout');return !!l&&!l.classList.contains('ratio-343')});
assert('족보 상세 계산식',()=>{w.switchCombatPanel('hands');w.toggleCombatHandDetails();const first=w.eval('POKER_HANDS[0]');const eq=d.querySelector('.combat-hand-equation');const ok=!!eq&&eq.textContent.includes('×')&&eq.textContent.includes(String(first.basePower*first.baseFocus));w.toggleCombatHandDetails();return ok});
assert('족보 강화 색상 단계',()=>w.combatHandTier(1)==='tier-white'&&w.combatHandTier(3)==='tier-yellow'&&w.combatHandTier(5)==='tier-orange'&&w.combatHandTier(6)==='tier-red');
assert('장비 상세 보기/숨기기',()=>{w.toggleEquipmentDetails();let on=d.getElementById('equipment-details-btn').getAttribute('aria-pressed')==='true';w.toggleEquipmentDetails();return on&&d.getElementById('equipment-details-btn').getAttribute('aria-pressed')==='false'});
assert('저장·이어하기 함수',()=>typeof w.saveRun==='function'&&typeof w.continueGame==='function');
}catch(e){add('검사 실행 예외',false,String(e));errors.push(String(e))}render()},250)};
frame.srcdoc=html;
}
window.addEventListener('message',e=>{if(e.source===$('test-frame').contentWindow&&e.data&&e.data.echoesTestError){errors.push(e.data.echoesTestError);render()}});
$('run').onclick=run;$('copy').onclick=async()=>{const t=$('log').textContent;try{await navigator.clipboard.writeText(t);$('copy').textContent='✓ 복사 완료'}catch(e){const sel=window.getSelection(),r=document.createRange();r.selectNodeContents($('log'));sel.removeAllRanges();sel.addRange(r);$('copy').textContent='로그를 선택했습니다. 복사해 주세요.'}};
run();</script></body></html>
