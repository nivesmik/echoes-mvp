<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHOES 전투 MVP</title><style>
:root{color-scheme:dark}body{font-family:system-ui,sans-serif;background:#11151b;color:#f0e8d9;max-width:850px;margin:auto;padding:22px}h1{color:#d6b777;letter-spacing:.13em}.arena{display:flex;justify-content:space-around;gap:14px;margin:24px 0}.unit{background:#222936;border:1px solid #4d5560;border-radius:12px;padding:22px;flex:1;text-align:center}.icon{font-size:65px}.hp{height:14px;background:#543136;border-radius:8px;overflow:hidden}.bar{height:100%;background:#b74954;transition:width .3s}.dice{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.die{font-size:35px;background:#eee9d9;color:#171717;border:3px solid transparent;border-radius:12px;width:65px;height:70px;cursor:pointer}.die.held{border-color:#e4b65d;background:#ffe5a6}button{cursor:pointer;border:0;border-radius:8px;padding:12px 18px;background:#a47c43;color:white;font-weight:bold;margin:5px}button:disabled{opacity:.4;cursor:default}.choices button{background:#343d4b}.choices button:hover{background:#596777}.panel{background:#1e2530;border-radius:12px;padding:18px;margin:15px 0}#log{min-height:55px;line-height:1.6;color:#d8c8a6}.hint{font-size:13px;color:#aaa}#status{font-weight:bold}</style></head><body>
<h1>ECHOES <small style="font-size:14px">전투 프로토타입 0.1</small></h1><p>중세 다크 판타지 · 포커 다이스 전투</p><div class="arena"><div class="unit"><div class="icon">♞</div><h2>기사</h2><div class="hp"><div id="pbar" class="bar"></div></div><p id="php"></p></div><div class="unit"><div class="icon">👹</div><h2>고블린</h2><div class="hp"><div id="ebar" class="bar"></div></div><p id="ehp"></p></div></div>
<div class="panel"><div id="status"></div><p class="hint">주사위를 누르면 고정됩니다. 고정되지 않은 주사위만 다시 굴립니다.</p><div class="dice" id="dice"></div><p><button id="roll">굴리기</button><button id="reset">전투 재시작</button></p><div id="remaining"></div></div><div class="panel"><h3>공격 족보 선택</h3><div id="choices" class="choices"></div></div><div class="panel"><h3>전투 기록</h3><div id="log"></div></div>
<script type="module">
import{eligible,damage,roll}from './rules.js';
let p,e,d,held,rolls,phase;const $=x=>document.getElementById(x);function init(){p=100;e=130;d=[1,1,1,1,1];held=[false,false,false,false,false];rolls=0;phase='ready';$('log').textContent='굴리기를 눌러 전투를 시작하세요.';draw()}function draw(){$('php').textContent=p+' / 100 HP';$('ehp').textContent=e+' / 130 HP';$('pbar').style.width=p+'%';$('ebar').style.width=100*e/130+'%';$('status').textContent=phase==='over'?(p>0?'승리!':'패배!'):phase==='ready'?'주사위를 굴려 주세요':'공격할 족보를 선택하세요';$('remaining').textContent='남은 리롤: '+(rolls?3-rolls:2)+'회';$('roll').disabled=phase==='over'||rolls===3;$('roll').textContent=rolls===0?'첫 굴림':'리롤';$('dice').innerHTML='';d.forEach((v,i)=>{const b=document.createElement('button');b.className='die'+(held[i]?' held':'');b.textContent=rolls?v:'?';b.disabled=!rolls||phase==='over';b.onclick=()=>{held[i]=!held[i];draw()};$('dice').append(b)});$('choices').innerHTML='';if(rolls&&phase!=='over')eligible(d).forEach(h=>{const b=document.createElement('button');b.textContent=h.name+' · 위력 '+h.power;b.onclick=()=>attack(h);$('choices').append(b)})}
function attack(h){const hit=damage(h.power,0,1,0,[]);e=Math.max(0,e-hit);let msg=h.name+'! 고블린에게 '+hit+' 피해.';if(e<=0){phase='over';msg+=' 고블린을 처치했습니다!'}else{const counter=7+Math.floor(Math.random()*7);p=Math.max(0,p-counter);msg+=' 고블린 반격 '+counter+' 피해.';if(!p){phase='over';msg+=' 기사가 쓰러졌습니다.'}else{rolls=0;held=[false,false,false,false,false];phase='ready'}}$('log').textContent=msg;draw()}
$('roll').onclick=()=>{if(rolls>=3||phase==='over')return;d=d.map((v,i)=>rolls&&held[i]?v:roll());rolls++;phase='choose';draw()};$('reset').onclick=init;init();
</script></body></html>
